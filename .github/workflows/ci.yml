name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  checks:
    name: Build & checks
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      - name: Check gofmt
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$output"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          # Build paths list dynamically since go.sum may not exist (zero-dep lib)
          paths=(go.mod)
          if [ -f go.sum ]; then paths+=(go.sum); fi
          if ! git diff --exit-code "${paths[@]}"; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit."
            exit 1
          fi

      - name: Run golangci-lint
        # wasm/ is excluded — it uses syscall/js which can't be type-checked
        # outside of GOOS=js/GOARCH=wasm builds.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: ./token/... ./ast/... ./parser/... ./validate/... ./eval/... ./examples/... ./internal/... ./conformance/... .

  test:
    name: Unit tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    needs: [checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # cgo needs a C compiler and the runner's has moved before: the job used
      # to hard-code clang, which vanished from the image and took the race
      # detector, and the FFI build down with it. Pick whichever is
      # actually installed, and say so plainly when none is.
      - name: Pick a C compiler for cgo
        run: |
          for candidate in clang gcc cc; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CC=$candidate" >> "$GITHUB_ENV"
              echo "using $candidate ($(command -v "$candidate"))"
              exit 0
            fi
          done
          echo "::error::No C compiler on this runner. cgo needs one for the race detector and the FFI build — install clang or gcc on the image."
          exit 1

      - name: Run tests
        # The race detector requires cgo, and the runner defaults to
        # CGO_ENABLED=0 — CC comes from the step above.
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 \
            -coverprofile=coverage.out -covermode=atomic \
            -coverpkg=./token/...,./ast/...,./parser/...,./validate/...,./eval/...,./ \
            ./token/... ./ast/... ./parser/... ./validate/... ./eval/... ./conformance/... .

      - name: Print coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Run the example programs
        run: go test -count=1 ./examples/

      # A short fuzz pass on every push; the seed corpus already runs as unit
      # tests above, this explores from it. `make fuzz FUZZTIME=5m` for more.
      - name: Fuzz (short)
        run: make fuzz FUZZTIME=20s

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage.out

  sql:
    name: Differential tests against SQLite
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    needs: [checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # conformance/sql is its own module so the library stays dependency-free;
      # its go directive follows the SQLite driver, hence the newer toolchain.
      # It runs every case in conformance/sql/testdata through the evaluator
      # and through a real SQLite database and requires both to agree.
      - name: Run the SQL differential corpus
        env:
          GOTOOLCHAIN: auto
        run: cd conformance/sql && go test -race -count=1 ./...

  wasm:
    name: WASM build & JS tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    needs: [checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # make build compiles query.wasm and copies Go's wasm_exec.js into
      # clients/npm, both of which the JavaScript tests load.
      - name: Build WASM
        run: make -C wasm build

      - name: Install npm deps
        run: cd clients/npm && npm install

      - name: Typecheck TypeScript bindings
        run: cd clients/npm && ./node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Run JS WASM tests
        run: node --test clients/npm/test/wasm.test.mjs

      - name: Run JS conformance tests
        run: node --test clients/npm/test/conformance.test.mjs

      - name: Build the package and load it from each source kind
        run: cd clients/npm && npm run build:ts && node --test test/load.test.mjs

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: query-wasm
          path: clients/npm/query.wasm
