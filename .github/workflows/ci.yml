name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  checks:
    name: Build & checks
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      - name: Check gofmt
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$output"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          # Build paths list dynamically since go.sum may not exist (zero-dep lib)
          paths=(go.mod)
          if [ -f go.sum ]; then paths+=(go.sum); fi
          if ! git diff --exit-code "${paths[@]}"; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit."
            exit 1
          fi

      - name: Run golangci-lint
        # wasm/ is excluded — it uses syscall/js which can't be type-checked
        # outside of GOOS=js/GOARCH=wasm builds.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: ./token/... ./ast/... ./parser/... ./validate/... ./eval/... ./examples/... ./internal/... ./conformance/... .

  test:
    name: Unit tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    needs: [checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # cgo needs a C compiler and the runner's has moved before: the job used
      # to hard-code clang, which vanished from the image and took the race
      # detector, the FFI build and Android down with it. Pick whichever is
      # actually installed, and say so plainly when none is.
      - name: Pick a C compiler for cgo
        run: |
          for candidate in clang gcc cc; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CC=$candidate" >> "$GITHUB_ENV"
              echo "using $candidate ($(command -v "$candidate"))"
              exit 0
            fi
          done
          echo "::error::No C compiler on this runner. cgo needs one for the race detector and the FFI build — install clang or gcc on the image."
          exit 1

      - name: Run tests
        # The race detector requires cgo, and the runner defaults to
        # CGO_ENABLED=0 — CC comes from the step above.
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 \
            -coverprofile=coverage.out -covermode=atomic \
            -coverpkg=./token/...,./ast/...,./parser/...,./validate/...,./eval/...,./ \
            ./token/... ./ast/... ./parser/... ./validate/... ./eval/... ./conformance/... .

      - name: Print coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage.out

  wasm:
    name: WASM build & JS tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    needs: [checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # make build compiles query.wasm and copies Go's wasm_exec.js into
      # clients/npm, both of which the JavaScript tests load.
      - name: Build WASM
        run: make -C wasm build

      - name: Install npm deps
        run: cd clients/npm && npm install

      - name: Typecheck TypeScript bindings
        run: cd clients/npm && ./node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Run JS WASM tests
        run: node --test clients/npm/test/wasm.test.mjs

      - name: Run JS conformance tests
        run: node --test clients/npm/test/conformance.test.mjs

      - name: Build the package and load it from each source kind
        run: cd clients/npm && npm run build:ts && node --test test/load.test.mjs

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: query-wasm
          path: clients/npm/query.wasm

  dart:
    name: Dart client & conformance (FFI + WASM)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    needs: [checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.5"

      # cgo needs a C compiler and the runner's has moved before: the job used
      # to hard-code clang, which vanished from the image and took the race
      # detector, the FFI build and Android down with it. Pick whichever is
      # actually installed, and say so plainly when none is.
      - name: Pick a C compiler for cgo
        run: |
          for candidate in clang gcc cc; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CC=$candidate" >> "$GITHUB_ENV"
              echo "using $candidate ($(command -v "$candidate"))"
              exit 0
            fi
          done
          echo "::error::No C compiler on this runner. cgo needs one for the race detector and the FFI build — install clang or gcc on the image."
          exit 1

      # Build the cgo c-shared library the Dart FFI backend loads; CC comes
      # from the step above.
      - name: Build native libquery
        env:
          CGO_ENABLED: "1"
        run: make -C clients/ffi build

      # Build query.wasm + wasm_exec.js and stage them (with the corpus) into
      # test/ so the browser test server can serve them.
      - name: Build web assets
        run: make -C clients/flutter web-assets

      - name: Install Dart deps
        run: cd clients/flutter && dart pub get

      - name: Analyze Dart client
        run: cd clients/flutter && dart analyze --fatal-infos

      # The native FFI backend runs the corpus on the Dart VM; the web
      # (dart:js_interop) backend runs the same corpus against the WASM build in
      # the runner's system Chrome.
      - name: Run Dart conformance (VM/FFI + browser/WASM)
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: cd clients/flutter && dart test -p vm,chrome

  android:
    name: Android (build + emulator)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    needs: [checks]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Prefer an NDK already on the hosted image. The fallback matches the
      # version in clients/ffi/Makefile and is new enough for 16KB pages.
      - name: Select Android NDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set on this runner; the Android job needs the SDK."
            exit 1
          fi
          ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          if [ -z "$ndk" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.1.13356709"
            ndk="$ANDROID_HOME/ndk/28.1.13356709"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "using NDK: $ndk"

      # Cross-compile one libquery.so per ABI with the runner's NDK.
      - name: Build per-ABI libquery.so
        run: make -C clients/ffi android

      # Assert each .so is a real Android object for the right arch, 16KB
      # page-aligned (Google Play mandate), with the FFI exports present.
      - name: Assert ELF arch, 16KB alignment, and FFI exports
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          jni=clients/flutter_plugin/android/src/main/jniLibs
          fail=0
          check() { # <abi> <arch-substring>
            so="$jni/$1/libquery.so"
            echo "== $1 =="
            file "$so" | grep -q "$2" || { echo "  FAIL: wrong arch ($2)"; fail=1; }
            aligned=$("$bin/llvm-objdump" -p "$so" | grep -A1 LOAD | grep align | grep -v '2\*\*14' || true)
            [ -z "$aligned" ] || { echo "  FAIL: not 16KB-aligned:"; echo "$aligned"; fail=1; }
            "$bin/llvm-nm" -D "$so" | grep -q "T QueryParse" || { echo "  FAIL: QueryParse not exported"; fail=1; }
            [ "$fail" = 0 ] && echo "  ok: arch, 16KB alignment, exports"
          }
          check arm64-v8a   "ARM aarch64"
          check armeabi-v7a "ARM, EABI5"
          check x86_64      "x86-64"
          exit $fail

      # Hosted runners require this rule for hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The real proof: build an APK that bundles the x86_64 libquery.so, install
      # it on the emulator, and run the integration test — TrazoQuery.load() must
      # open the bundled .so, resolve the FFI symbols, and run the Go engine.
      - name: Run on-device integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on
          disable-animations: true
          script: |
            cd clients/flutter_plugin/example
            flutter create --platforms=android --project-name trazo_query_flutter_example .
            flutter pub get
            flutter test integration_test/load_test.dart -d emulator-5554
